<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif}
body{background:#080604;color:#fff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;background:
radial-gradient(circle at 20% 20%,rgba(130,70,255,.24),transparent 30%),
radial-gradient(circle at 80% 30%,rgba(0,180,255,.18),transparent 28%),
radial-gradient(circle at 50% 90%,rgba(255,40,130,.13),transparent 30%);
filter:blur(20px);z-index:-1}
.wrap{max-width:900px;margin:auto;padding:22px}
.live{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border:1px solid #f3ad351f;background:#120d06cc;border-radius:999px;backdrop-filter:blur(12px);font-weight:700;box-shadow:0 8px 30px #0008,0 0 25px #d88a1a12}
.dot{width:9px;height:9px;background:#42ff8b;border-radius:50%;box-shadow:0 0 14px #42ff8b;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.hero{text-align:center;padding:65px 10px 35px}
.avatar{width:105px;height:105px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#00d4ff);box-shadow:0 0 55px #8b5cf655;border:3px solid #ffffff22;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar{box-shadow:0 0 0 5px #ffffff0b,0 0 60px #ff9d2e35,0 0 90px #8b5cf625}
h1{font-size:clamp(38px,8vw,72px);margin:20px 0 8px;letter-spacing:-2px;
background:linear-gradient(90deg,#d98713,#ffd56a,#fff,#e9a02b);
-webkit-background-clip:text;background-clip:text;color:transparent;
text-shadow:0 0 35px #d98a1a30}
.sub{color:#a9a9b8;font-size:17px}
.links{display:grid;gap:15px;margin:28px 0}
.card{position:relative;display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid #e9a52a22;border-radius:20px;background:linear-gradient(135deg,#171007cc,#0b0805cc);color:#fff;text-decoration:none;transition:.25s;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff08,transparent);transform:translateX(-100%);transition:.5s}
.card:hover{transform:translateY(-4px);border-color:#e9a52a66;background:linear-gradient(135deg,#211507,#0d0905);box-shadow:0 15px 40px #0007}
.card:hover:before{transform:translateX(100%)}
.icon{width:54px;height:54px;flex:0 0 54px;border-radius:17px;display:grid;place-items:center;overflow:hidden;border:1px solid #ffffff25;box-shadow:inset 0 1px 0 #ffffff25,0 8px 22px #0005;position:relative}
.icon:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff22,transparent 48%,#0003);pointer-events:none}
.icon img{width:100%;height:100%;object-fit:contain;padding:12px;position:relative;z-index:1}
.card:nth-child(1) .icon{background:linear-gradient(145deg,#ff0033,#c90025)}
.card:nth-child(2) .icon{background:linear-gradient(145deg,#25f4ee,#111 48%,#ff0050)}
.card:nth-child(3) .icon{background:linear-gradient(145deg,#ffdc80,#fc4a1a 45%,#8a2be2)}
.card:nth-child(4) .icon{background:linear-gradient(145deg,#5865f2,#313338)}
.name{font-weight:800;font-size:18px}.handle{color:#9999aa;font-size:13px;margin-top:3px}.arrow{margin-right:auto;color:#aaa;font-size:20px}
.note{text-align:center;color:#77778a;font-size:12px;margin-top:30px}
footer{text-align:center;color:#666679;padding:30px 0 15px;font-size:12px}
</style>
